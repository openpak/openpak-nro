name: release

# Every push to main builds both NROs and keeps them as a workflow artifact. A v* tag also
# publishes them as release assets, which is what a console owner downloads.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # The toggle logic has a host-side check that needs nothing but a C compiler.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  build:
    runs-on: ubuntu-latest
    container: docker.io/devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make UI=console
      - uses: actions/upload-artifact@v4
        with:
          name: nro
          path: |
            openpak.nro
            openpak-console.nro
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nro
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" openpak.nro openpak-console.nro \
            --repo "$GITHUB_REPOSITORY" --title "openpak-nro $GITHUB_REF_NAME" \
            --notes "Copy openpak.nro to /switch/ on the SD card. openpak-console.nro is the plain-text fallback."
