name: release

# A vX.Y.Z tag builds both NROs and publishes them as release assets, which
# is what a console owner downloads; pushes to main build nothing. The self-hosted build keeps
# all intermediate files in one job so GitHub artifact storage is not needed.
#
# The `build` job includes the build-time bundle resolution of PRD
# universal-tls-forwarding/03 (G2 pilot): once the switch/staging
# registration exists, releases fetch the signed bundle and verify it before
# anything is compiled in. It runs only when OPENPAK_CLIENT_HASH is set as a
# repository variable — an unset hash keeps manual builds on the checked-in
# fixtures, the disabled path of the variable contract. Certification is
# never inferred from a variable being set; the certified fetch runs only
# here, with the CI identity proof the registry accepts.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # The toggle logic has a host-side check that needs nothing but a C compiler.
    runs-on: [self-hosted, linux, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Scratch in the workspace, not the runner's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
      - run: make test
      - name: Clear scratch
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.tmp"

  build:
    needs: test
    runs-on: [self-hosted, linux, podman]
    permissions:
      contents: write
      id-token: write # the job's own OIDC identity (02 AUTH-001)
    # The protected environment (02 AUTH-001): the OIDC token carries its
    # name, and only a production-environment assertion authorizes a
    # production-approved registration.
    environment: production
    env:
      # Both the exchange (authenticate) and the fetch steps speak the same
      # variable contract (03).
      OPENPAK_NETWORK_MODE: certified
      OPENPAK_CLIENT_HASH: ${{ vars.OPENPAK_CLIENT_HASH }}
      OPENPAK_PLATFORM: switch
      OPENPAK_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4 # for the pinned trust root file
      - name: Scratch in the workspace, not the runner's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
      - name: Pin the fetch tool (03 BUILD-009)
        if: vars.OPENPAK_CLIENT_HASH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "$(mktemp -d)"
          # The website repository is private, so the CI-built binary rides
          # on this repository's releases; the pinned hash here is what the
          # website release's checksums.txt recorded for this tool revision
          # (openpak/website v0.41.4). The pin, not the download location,
          # is what authenticates the bytes.
          gh release download openpak-network-v0.41.2 --repo "$GITHUB_REPOSITORY" \
            --pattern "openpak-network-linux-amd64"
          echo "a326e1a549eb446c4d9cd1bc948905e2dc3199a0c1911bb2c9228800593e5a75  openpak-network-linux-amd64" | sha256sum -c -
          mv openpak-network-linux-amd64 openpak-network
          chmod +x openpak-network
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Authenticate the release job (02 AUTH-001)
        if: vars.OPENPAK_CLIENT_HASH != ''
        run: |
          set -e
          if [ -n "${{ vars.OPENPAK_OIDC_AUDIENCE }}" ]; then
            openpak-network authenticate \
              --audience "${{ vars.OPENPAK_OIDC_AUDIENCE }}" \
              --token-output "$RUNNER_TEMP/openpak-token"
          else
            # Interim staging path before the OIDC audience sign-off: the
            # separately issued exchange secret, never the public hash.
            openpak-network authenticate \
              --token "${{ secrets.OPENPAK_STAGING_TOKEN }}" \
              --token-output "$RUNNER_TEMP/openpak-token"
          fi
      - name: Fetch and verify the bundle (03 BUILD-002)
        if: vars.OPENPAK_CLIENT_HASH != ''
        env:
          OPENPAK_BUILD_TOKEN_FILE: ${{ runner.temp }}/openpak-token
          OPENPAK_BUNDLE_DIR: ${{ github.workspace }}/openpak-bundle
          OPENPAK_ROOT_FILE: ${{ github.workspace }}/openpak/root.json
        run: |
          set -e
          openpak-network fetch --output "$OPENPAK_BUNDLE_DIR"
          openpak-network verify --bundle-dir "$OPENPAK_BUNDLE_DIR"
      - name: Install the verified bundle into RomFS (03 BUILD-M1)
        run: |
          set -e
          if [ -f openpak-bundle/policy.json ]; then
            mkdir -p romfs/openpak
            cp openpak-bundle/policy.json romfs/openpak/policy.json
            cp openpak-bundle/trust/ca.pem romfs/ca.pem
            rm -f romfs/ca.der # make regenerates it from the fetched CA
            echo "romfs carries the registry-verified bundle ($OPENPAK_CHANNEL)"
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            # Since the hosts block is generated from the bundle (PRD 05 SETUP-001), a
            # release without one would ship consoles the frozen compiled fallback while
            # looking like any other build. A manual run may do that; a tag may not.
            echo "::error::tagged release resolved no bundle; refusing to publish the fallback"
            exit 1
          else
            echo "no resolved bundle; building on the compiled fallback (disabled path)"
          fi
      - name: Build both NRO variants
        run: |
          set -e
          podman run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            docker.io/devkitpro/devkita64:latest make
          podman run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            docker.io/devkitpro/devkita64:latest make UI=console
      - name: Publish tag assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          assets=(openpak.nro openpak-console.nro)
          if [ -f openpak-bundle/openpak-network.lock.json ]; then
            # 03: a certified release retains the lockfile beside the binary.
            assets+=(openpak-bundle/openpak-network.lock.json)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --title "openpak-nro $GITHUB_REF_NAME" \
              --notes "Copy openpak.nro to /switch/ on the SD card. openpak-console.nro is the plain-text fallback."
          fi
      - name: Clear scratch
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.tmp"
